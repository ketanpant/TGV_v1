<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="The Good Vault — coming soon." />
    <title>The Good Vault — Coming Soon</title>
    <style>
      :root { --ink: #102a43; --gold: #d6a948; --cream: #fff9eb; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh; margin: 0; display: grid; place-items: center;
        padding: 28px; color: var(--cream); background:
          radial-gradient(circle at 15% 10%, #1b4769 0, transparent 35%),
          radial-gradient(circle at 88% 82%, #263f58 0, transparent 38%), var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }
      main { width: min(650px, 100%); text-align: center; }
      .mark {
        width: 116px; height: 116px; margin: 0 auto 28px; border: 4px solid var(--gold);
        border-radius: 50%; display: grid; place-items: center; position: relative;
        box-shadow: 0 0 0 10px rgba(214,169,72,.12);
      }
      .mark::before, .mark::after { content: ""; position: absolute; background: var(--gold); }
      .mark::before { width: 68px; height: 7px; border-radius: 8px; }
      .mark::after { width: 7px; height: 68px; border-radius: 8px; }
      .wheel { width: 48px; height: 48px; border: 6px solid var(--gold); border-radius: 50%; z-index: 1; background: var(--ink); }
      .eyebrow { color: var(--gold); font-size: .76rem; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; }
      h1 { margin: 13px 0 22px; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(2.7rem, 10vw, 5.3rem); line-height: .95; font-weight: 700; }
      .message { max-width: 550px; margin: 0 auto; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(1.25rem, 3.5vw, 1.65rem); line-height: 1.45; }
      .rule { width: 72px; height: 2px; margin: 34px auto; background: var(--gold); }
      nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 13px; }
      a { color: var(--cream); text-decoration: none; }
      .button { border: 1px solid rgba(255,249,235,.65); border-radius: 999px; padding: 12px 18px; font-size: .92rem; transition: .2s ease; }
      .button:hover { color: var(--ink); background: var(--gold); border-color: var(--gold); }
      .email { display: inline-block; margin-bottom: 14px; color: var(--gold); font-size: 1rem; font-weight: 700; letter-spacing: .02em; }
      .email:hover { color: var(--cream); }
      footer { margin-top: 42px; color: rgba(255,249,235,.62); font-size: .78rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"><div class="wheel"></div></div>
      <div class="eyebrow">Coming Soon</div>
      <h1>The Good Vault</h1>
      <p class="message">Secure everything you love, for the ones you love!!</p>
      <div class="rule"></div>
      <nav aria-label="Contact links">
        <div>
          <a class="email" href="mailto:support@thegoodvault.com">support@thegoodvault.com</a><br /><br />
          <a class="button" href="https://www.instagram.com/team_tgv/" target="_blank" rel="noopener noreferrer">Follow on Instagram</a>
        </div>
      </nav>
      <footer>© 2026 The Good Vault</footer>
    </main>
  </body>
</html>
